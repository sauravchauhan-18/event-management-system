{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('dashboard') }}">← Dashboard</a><section class="form-page"><div class="form-intro"><span class="eyebrow muted">THE DETAILS</span><h1>{{ page_title }}<span>.</span></h1><p>A few details are all it takes to bring your people together.</p><div class="form-aside">✳<br><small>GOOD PLANS<br>START HERE</small></div></div><div class="form-panel"><form method="post" class="form-stack"><label>Event name<input name="title" required maxlength="100" value="{{ event.title or '' }}" placeholder="e.g. Sunday morning run club"></label><label>What's it about?<textarea name="description" required rows="5" placeholder="Tell people what makes this event special...">{{ event.description or '' }}</textarea></label><div class="form-row"><label>Date and time<input name="event_date" type="datetime-local" required value="{{ event.event_date or '' }}"></label><label>Guest capacity<input name="capacity" type="number" min="1" max="100000" required value="{{ event.capacity or '' }}" placeholder="40"></label></div><label>Where is it?<input name="location" required maxlength="120" value="{{ event.location or '' }}" placeholder="Venue, neighborhood or online"></label><div class="form-actions"><a href="{{ url_for('dashboard') }}" class="cancel-link">Cancel</a><button class="button button-dark" type="submit">Save event <span>↗</span></button></div></form></div></section>
{% endblock %}
