services:
  - type: web
    name: event-management-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ORGANIZER_USERNAME
        value: organizer
      - key: ORGANIZER_PASSWORD
        generateValue: true
